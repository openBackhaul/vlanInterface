    get:
      operationId: getCachedVlanInterfaceCapability
      summary: 'Provides VlanInterfaceCapability from cache'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: 'VlanInterfaceCapability provided from cache'
          content:
            application/json:
              schema:
                type: object
                required:
                  - vlan-interface-1-0:vlan-interface-capability
                properties:
                  vlan-interface-1-0:vlan-interface-capability:
                    $ref: '#/components/schemas/vlan-interface-capability'
                example:
                  vlan-interface-1-0:vlan-interface-capability:
                    supported-sub-layer-protocol-name-list:
                      - 'vlan-interface-1-0:SUB_LAYER_PROTOCOL_NAME_TYPE_D_BRIDGE_COMPONENT'
                    supported-interface-kind-list:
                      - 'vlan-interface-1-0:INTERFACE_KIND_TYPE_D_BRIDGE_PORT'
                    tagging-and-mvrp-is-avail: true
                    configuring-ingress-tag-filtering-is-avail: true
                    ingress-vlan-id-filtering-is-avail: true
                    available-pcp-bits-interpretation-kind-list:
                      - 'vlan-interface-1-0:PCP_BITS_INTERPRETATION_KIND_TYPE_8P0D'
                    configuring-pcp-bits-decoding-is-avail: true
                    configuring-pcp-bits-encoding-is-avail: true
                    drop-eligible-indicator-is-avail: true
                    number-of-available-priorities: 0
                    received-priority-overwriting-is-avail: true
                    vlan-id-translation-is-avail: true
                    egress-vlan-id-translation-is-avail: true
                    port-and-protocol-based-vlan-is-avail: true
                    max-number-of-protocol-vlan-id-groupings: 0
                    service-access-priority-tagging-is-avail: true
                    configuring-service-access-priority-mapping-is-avail: true
                    priority-to-traffic-class-mapping-is-avail: true
                    number-of-available-traffic-classes: 0
                    restricted-automated-vlan-registration-is-avail: true
                    admin-shut-down-is-avail: true
                    untagged-pep-is-avail: true
                    untagged-cep-is-avail: true
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            exec-time:
              $ref: '#/components/headers/exec-time'
            backend-time:
              $ref: '#/components/headers/backend-time'
            life-cycle-state:
              $ref: '#/components/headers/life-cycle-state'
        '4XX':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
  /core-model-1-4:network-control-domain=cache/control-construct={mountName}/logical-termination-point={uuid}/layer-protocol={localId}/vlan-interface-1-0:vlan-interface-pac/vlan-interface-configuration:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
      - $ref: '#/components/parameters/mountName'
      - $ref: '#/components/parameters/uuid'
      - $ref: '#/components/parameters/localId'
      - $ref: '#/components/parameters/fields'
    get:
      operationId: getCachedVlanInterfaceConfiguration
      summary: 'Provides VlanInterfaceConfiguration from cache'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: 'VlanInterfaceConfiguration provided from cache'
          content:
            application/json:
              schema:
                type: object
                required:
                  - vlan-interface-1-0:vlan-interface-configuration
                properties:
                  vlan-interface-1-0:vlan-interface-configuration:
                    $ref: '#/components/schemas/vlan-interface-configuration'
                example:
                  vlan-interface-1-0:vlan-interface-configuration:
                    interface-name: 'string'
                    sub-layer-protocol-name: 'vlan-interface-1-0:SUB_LAYER_PROTOCOL_NAME_TYPE_D_BRIDGE_COMPONENT'
                    interface-kind: 'vlan-interface-1-0:INTERFACE_KIND_TYPE_D_BRIDGE_PORT'
                    default-vlan-id: 'string'
                    default-priority: 0
                    ingress-tag-filtering: >-
                      vlan-interface-1-0:INGRESS_TAG_FILTERING_TYPE_UNTAGGED_AND_PRIORITY_FRAMES_ONLY
                    ingress-vlan-id-filtering-is-on: true
                    pcp-bits-interpretation-kind: 'vlan-interface-1-0:PCP_BITS_INTERPRETATION_KIND_TYPE_8P0D'
                    pcp-bit-to-priority-mapping-list:
                      - to-be-decoded-pcp-bits-value: 0
                        associated-priority-value: 7
                        associated-drop-eligibility: true
                    pcp-bits-encoding-mapping-list:
                      - to-be-encoded-priority-value: 0
                        to-be-encoded-drop-eligibility: true
                        associated-pcp-bits-value: 0
                    drop-eligible-indicator-is-on: true
                    drop-eligible-encoding-is-required: true
                    received-priority-overwriting-is-on: true
                    received-priority-overwriting-list:
                      - to-be-overwritten-priority-value: 0
                        new-priority-value: 0
                    vlan-id-translation-is-on: true
                    external-to-internal-vlan-id-mapping-list:
                      - external-vlan-id: 0
                        internal-vlan-id: 0
                    egress-vlan-id-translation-is-on: true
                    internal-to-egress-vlan-id-mapping-list:
                      - internal-vlan-id: 0
                        egress-vlan-id: 0
                    forwarded-protocol-vlan-id-grouping-list:
                      - forwarded-protocol-group-id: 0
                        forwarded-vlan-id-list:
                          - 'string'
                    service-access-priority-tagging-is-on: true
                    service-access-priority-mapping-list:
                      - c-vlan-priority-value: 0
                        s-vlan-pcp-bits-value: 0
                    priority-to-traffic-class-mapping-list:
                      - priority-value: 7
                        traffic-class-value: 7
                    restricted-automated-vlan-registration-is-on: true
                    admin-point-to-point: 'vlan-interface-1-0:ADMIN_POINT_TO_POINT_TYPE_FORCE_TRUE'
                    forwarded-cvlan-id-to-svlan-id-list:
                      - c-vlan-id: 0
                        s-vlan-id: 0
                        s-vlan-priority-kind: 'vlan-interface-1-0:SVLAN_PRIORITY_KIND_TYPE_NONE'
                        fixed-svlan-priority: 0
                        untagged-pep: true
                        untagged-cep: true
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            exec-time:
              $ref: '#/components/headers/exec-time'
            backend-time:
              $ref: '#/components/headers/backend-time'
            life-cycle-state:
              $ref: '#/components/headers/life-cycle-state'
        '4XX':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'


